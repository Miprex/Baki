<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dünyanın En Güzeline...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html {
            height: 100%;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            background: #000;
        }

        /* Arka Plan Videosu */
        #bg-video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            z-index: 0;
            filter: brightness(0.5) blur(2px);
            object-fit: cover;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.4) 80%);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            color: white;
            padding: 20px;
        }

        h1 {
            font-size: 3rem;
            text-shadow: 0 0 30px rgba(255, 20, 147, 0.9);
            margin-bottom: 10px;
            font-weight: 800;
        }

        h2 {
            font-size: 1.8rem;
            color: #ff85a1;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        #plead-text {
            height: 40px;
            font-size: 1.4rem;
            color: #fff;
            margin-bottom: 40px;
            font-weight: 300;
            background: rgba(255, 255, 255, 0.1);
            padding: 5px 20px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            cursor: pointer; /* Tıklanabilir hissi vermek için */
        }
    </style>
</head>
<body>

    <!-- Arka Plan Videosu -->
    <!-- Eğer videonun kendi sesi varsa ve onu oynatmak istiyorsan 'muted' ibaresini silebilirsin -->
    <video autoplay loop muted id="bg-video">
        <source src="video-dosyaniz.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <div class="container">
        <h1>Dünyanın En Güzeline...</h1>
        <h2>Seni Çok Seviyorum</h2>
        <!-- Kullanıcı buraya tıkladığında müzik başlayacak -->
        <div id="plead-text" onclick="muzikCal()">Müziği Başlatmak İçin Tıkla 🎵</div>
    </div>

    <!-- Şarkı Dosyası (Buraya kendi müzik dosyanın yolunu yazmalısın) -->
    <audio id="background-music" src="sarki-dosyaniz.mp3" loop></audio>

    <script>
        function muzikCal() {
            var audio = document.getElementById("background-music");
            audio.play().then(() => {
                // Müzik başarıyla başladığında yazıyı değiştirebilir veya gizleyebilirsin
                document.getElementById("plead-text").innerText = "Sihirli An başladı... ✨";
            }).catch(error => {
                console.log("Müzik çalınamadı:", error);
            });
        }
    </script>

</body>
</html>
